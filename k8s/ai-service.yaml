apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels: { app: ai-service }
    spec:
      containers:
        - name: ai-service
          image: monex-ai:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3001 }]
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY
            - name: BACKEND_URL
              value: "http://backend-service:8080/api"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: banking
spec:
  selector: { app: ai-service }
  ports:
    - port: 3001
      targetPort: 3001