server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend-service:8080/api/;
    }

    location /ai/ {
        proxy_pass http://host.minikube.internal:3001/ai/;   # ⬅️ CHANGED to host
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}